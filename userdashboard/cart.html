<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button class="back-page-btn" onclick="goBack()">
    <i class="fa-solid fa-arrow-left"></i>
    Back
</button>

<script>
function goBack() {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "index.html";
    }
}
</script>

<div class="container py-5">

    <h2 class="fw-bold mb-4">
        🛒 Shopping Cart
    </h2>

    <div class="row">

        <!-- Cart Items -->

        <div class="col-lg-8">

            <div id="cartContainer"></div>

        </div>

        <!-- Order Summary -->

     <div class="col-lg-4">

    <!-- Delivery Card -->
    <div class="card border-0 shadow-sm rounded-4 mb-3 p-4">

        <div class="d-flex align-items-center">

            <div class="bg-success bg-opacity-10 rounded-circle p-3 me-3">

                🚚

            </div>

            <div>

                <h5 class="fw-bold mb-1">

                    Delivery in 25-30 Minutes

                </h5>

                <small class="text-muted">

                    FreshNest Express Delivery

                </small>

            </div>

        </div>

    </div>

    <!-- Bill Details -->
    <div class="card border-0 shadow-sm rounded-4 p-4">

        <h4 class="fw-bold mb-4">

            Bill Details

        </h4>

        <div class="d-flex justify-content-between mb-3">

            <span>Items Total</span>

            <span>

                ₹<span id="itemsTotal">0</span>

            </span>

        </div>

        <div class="d-flex justify-content-between mb-3">

            <span>Discount</span>

            <span class="text-success">

                - ₹<span id="discountAmount">0</span>

            </span>

        </div>

        <div class="d-flex justify-content-between mb-3">

            <span>Delivery Charge</span>

            <span class="text-success">

                FREE

            </span>

        </div>

        <hr>

        <div class="d-flex justify-content-between mb-3">

            <h5 class="fw-bold">

                Grand Total

            </h5>

            <h5 class="fw-bold text-success">

                ₹<span id="grandTotal">0</span>

            </h5>

        </div>

        <div class="alert alert-success border-0 rounded-3">

            🎉 You saved

            <strong>

                ₹<span id="savedAmount">0</span>

            </strong>

            today

        </div>

        <button
            class="btn btn-success btn-lg w-100 rounded-3 mt-2"
            onclick="window.location.href='checkout.html'">

            Proceed to Checkout →

        </button>

    </div>

</div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase-config.js"></script>
<script src="cart.js"></script>

</body>
</html>
