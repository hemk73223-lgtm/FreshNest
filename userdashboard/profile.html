<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FreshNest | My Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f5f7f6;
        }

        .profile-wrapper {
            max-width: 900px;
            margin: 50px auto;
        }

        .profile-header {
            background: linear-gradient(
                135deg,
                #16a34a,
                #22c55e
            );

            color: white;

            border-radius: 20px 20px 0 0;

            padding: 35px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;

            background: white;

            color: #16a34a;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

            margin-bottom: 15px;
        }

        .profile-card {
            background: white;

            border-radius: 20px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.08);

            overflow: hidden;
        }

        .profile-body {
            padding: 35px;
        }

        .form-label {
            font-weight: 600;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
        }

        @media(max-width:576px) {

            .profile-body {
                padding: 20px;
            }

            .profile-header {
                padding: 25px;
            }

            .profile-actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-success fs-3"
            href="index.html">

            🛒 FreshNest

        </a>


        <div class="ms-auto">

            <a
                href="index.html"
                class="btn btn-outline-success">

                <i class="fas fa-home"></i>

                Dashboard

            </a>

        </div>

    </div>

</nav>



<!-- ================= PROFILE ================= -->

<div class="container">

    <div class="profile-wrapper">

        <div class="profile-card">


            <!-- HEADER -->

            <div class="profile-header">

                <div class="profile-icon">

                    <i class="fas fa-user"></i>

                </div>


                <h2 class="fw-bold mb-1">

                    My Profile

                </h2>


                <p class="mb-0">

                    Manage your FreshNest account

                </p>

            </div>



            <!-- BODY -->

            <div class="profile-body">


                <div
                    id="profileMessage"
                    class="alert d-none">
                </div>


                <form id="profileForm">


                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label class="form-label">

                            Username

                        </label>

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            placeholder="Enter username"
                            required>

                    </div>



                    <!-- PHONE -->

                    <div class="mb-3">

                        <label class="form-label">

                            Phone Number

                        </label>

                        <input
                            type="text"
                            id="phone"
                            class="form-control"
                            placeholder="Phone number"
                            readonly>

                        <small class="text-muted">

                            Phone number cannot be changed here.

                        </small>

                    </div>



                    <!-- STREET -->

                    <div class="mb-3">

                        <label class="form-label">

                            Street / Address

                        </label>

                        <input
                            type="text"
                            id="street"
                            class="form-control"
                            placeholder="Enter your street">

                    </div>



                    <!-- LANDMARK -->

                    <div class="mb-3">

                        <label class="form-label">

                            Landmark

                        </label>

                        <input
                            type="text"
                            id="landmark"
                            class="form-control"
                            placeholder="Enter landmark">

                    </div>



                    <!-- DISTRICT -->

                    <div class="mb-4">

                        <label class="form-label">

                            District

                        </label>

                        <input
                            type="text"
                            id="district"
                            class="form-control"
                            placeholder="Enter district">

                    </div>



                    <!-- BUTTONS -->

                    <div class="profile-actions">

                        <button
                            type="submit"
                            class="btn btn-success flex-fill">

                            <i class="fas fa-save"></i>

                            Save Changes

                        </button>


                        <button
                            type="button"
                            class="btn btn-outline-secondary flex-fill"
                            onclick="window.location.href='index.html'">

                            Cancel

                        </button>

                    </div>


                </form>

            </div>

        </div>

    </div>

</div>



<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase-config.js"></script>

<script src="profile.js"></script>


</body>

</html>
